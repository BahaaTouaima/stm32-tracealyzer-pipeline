name: CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake gcc-arm-none-eabi
      - name: Build firmware
        run: |
          mkdir -p firmware/build/gcc/output
          mkdir -p build
          cd build
          cmake ..
          cmake --build .




      - name: Install QEMU and GDB
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm gdb-multiarch
      - name: Capture and parse trace
        run: |
          bash ci/capture_trace.sh
          python3 ci/parse_events.py ci/trace.bin ci/trace_events.csv
      - name: Upload trace results
        uses: actions/upload-artifact@v4
        with:
          name: trace-events
          path: ci/trace_events.csv




      - name: Log pipeline run
        run: |
          echo "Pipeline run triggered at $(date '+%Y-%m-%d %H:%M:%S')"
          echo "Commit: ${{ github.sha }}"




      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck --enable=warning,style,performance \
            --suppress=missingIncludeSystem \
            -I firmware/config -I firmware/CMSIS \
            firmware/main.c firmware/main_blinky.c firmware/build/gcc/startup_gcc.c \
            firmware/build/gcc/RegTest.c firmware/build/gcc/timer_handlers_stub.c \
            --output-file=cppcheck-results.txt

      - name: Upload cppcheck results
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-results
          path: cppcheck-results.txt     
