name: CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log pipeline run
        run: |
          echo "Pipeline run triggered at $(date '+%Y-%m-%d %H:%M:%S')"
          echo "Commit: ${{ github.sha }}"
